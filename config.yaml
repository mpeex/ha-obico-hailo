name: Obico ML (Hailo)
version: "0.16"
slug: obico_ml_hailo
description: >-
  Home Assistant addon for Obico ML-based spaghetti/failure detection on a
  Raspberry Pi 5 with a Hailo-8 / Hailo-8L AI accelerator (Raspberry Pi AI
  HAT+). Runs the Obico YOLOv5 model from compiled HEFs on the Hailo device.
url: https://github.com/mpeex/ha-obico-hailo
image: ghcr.io/mpeex/obico_ml_hailo_addon-{arch}
arch:
  - aarch64
  - amd64
startup: services
init: false
stateful: true
udev: true
devices:
  - /dev/hailo0
homeassistant: "2026.9.0"
options: {}
schema: {}
homeassistant_api: true
ports:
  3333/tcp: 3333
ports_description:
  3333/tcp: >-
    API port. Published on the host so Home Assistant core reaches the addon
    without DNS via the Supervisor network gateway (http://172.30.32.1:3333).
    It is also reachable from the LAN — keep the network trusted or firewall it.