name: Obico ML (Hailo)
version: "1.1.0"
slug: obico_ml_hailo
description: >-
  Home Assistant addon for Obico ML-based spaghetti/failure detection on a
  Raspberry Pi 5 with a Hailo-8 / Hailo-8L AI accelerator (Raspberry Pi AI
  HAT+). Runs the Obico YOLOv5 model from compiled HEFs on the Hailo device.
url: https://github.com/mpeex/spaghetti-rpi5-aikit
image: ghcr.io/mpeex/obico_ml_hailo_addon-{arch}
arch:
  - aarch64
  - amd64
startup: services
init: false
map:
  - config:ro
privileged:
  - SYS_RAWIO
apparmor: false
full_access: true
stateful: true
devices:
  - /dev/hailo0:/dev/hailo0
ports:
  3333/tcp: 3333
webui: "http://[HOST]:[PORT:3333]"
options:
  max_fps: 1
  camera_entity: ""
  interval: 10
  threshold: 0.2
schema:
  max_fps: "int(0,60)"
  camera_entity: str
  interval: "int(1,3600)"
  threshold: "float(0,1)"
healthcheck:
  enabled: true
  interval: 30s
  timeout: 30s
  retries: 3
