name: Obico ML (Hailo)
version: "0.9"
slug: obico_ml_hailo
description: >-
  Home Assistant addon for Obico ML-based spaghetti/failure detection on a
  Raspberry Pi 5 with a Hailo-8 / Hailo-8L AI accelerator (Raspberry Pi AI
  HAT+). Runs the Obico YOLOv5 model from compiled HEFs on the Hailo device.
url: https://github.com/mpeex/spaghetti-rpi5-aikit
image: ghcr.io/mpeex/obico_ml_hailo_addon-{arch}
arch:
  - aarch64
  - amd64
startup: services
init: false
stateful: true
udev: true
devices:
  - /dev/hailo0
options:
  max_fps: 1
  camera_entity: ""
  interval: 10
  threshold: 0.2
  auto_start: false
schema:
  max_fps: "int(0,60)"
  camera_entity: str
  interval: "int(1,3600)"
  threshold: "float(0,1)"
  auto_start: bool
homeassistant_api: true
ingress: true
ports:
  3333/tcp: "172.30.32.1:3333"
ports_description:
  3333/tcp: >-
    API port, bound only to the Supervisor network gateway so Home Assistant
    core can reach the addon without DNS (http://172.30.32.1:3333). Not exposed
    to the LAN.
