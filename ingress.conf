# HA Ingress (see https://developers.home-assistant.io/docs/apps/presentation#ingress)
#
# nginx listens on the ingress port (8099, the HA default). Only connections
# from the HA ingress proxy (172.30.32.2) are accepted; everything else is
# rejected. All requests are proxied to the Flask app on the internal port.
server {
    listen 8099;

    allow  172.30.32.2;
    deny   all;

    location / {
        proxy_pass http://127.0.0.1:3333;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Ingress-Path $http_x_ingress_path;
    }
}